[project]
name = "kakigori"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.1.0",
    "brotli>=1.2.0",
    "fonttools>=4.61.1",
    "numpy>=2.0.0",
    "Pillow>=11.0.0",
    "timm>=1.0.25",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.48.3",
    "tqdm>=4.67.3",
    "pypdfium2>=4.30.0",
    "torchmetrics>=1.8.2",
    "pycocotools>=2.0.11",
    "opencv-contrib-python>=4.13.0.92",
    "matplotlib>=3.10.8",
    "pyside6>=6.10.2",
    "albumentationsx>=2.0.18",
    "pyyaml>=6.0.3",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "scikit-learn>=1.8.0",
    "torch-geometric>=2.7.0",
    "ipysigma>=0.24.6",
    "jupyter>=1.1.1",
    "musicset[synth]",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.18",
    "tensorboard>=2.19.0",
    "setuptools",
    "six",
    "ipykernel>=7.2.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
musicset = { path = "../musicset", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff.lint]
select = ["I", "E402"]

[tool.ruff.lint.isort]
length-sort = true

[tool.ruff.lint.isort.import-heading]
future = "Future imports"
standard-library = "Standard library imports"
third-party = "Third party imports"
first-party = "First party imports"
local-folder = "Local folder imports"



[project.scripts]
train-model = "kakigori.vision.train:main"
eval-model = "kakigori.vision.eval:main"
infer-model = "kakigori.vision.infer:main"
infer-omr = "kakigori.graph.infer:main"
visualize-model = "kakigori.vision.visualize:main"
calculate-areas = "kakigori.vision.calculate_areas:main"
retrain-model = "kakigori.vision.retrain:main"
train-gnn = "kakigori.graph.train:main"
train-joint = "kakigori.graph.train_joint:main"
validate-groundtruth = "kakigori.graph.validate_groundtruth:main"
compare-kern = "kakigori.graph.compare_kern:main"
validate-predictions = "kakigori.graph.validate_predictions:main"
validate-detections = "kakigori.graph.validate_detections:main"
