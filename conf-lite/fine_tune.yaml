# LITE synthetic fine-tune on the ReGLA base run (checkpoints_lite/run_004,
# varied validation-lite mAP@.50 0.656 / .50:.95 0.497). Targets its weak,
# under-represented classes (AP@.50:.95 < 0.3): timeSig9 / timeSigCommon /
# rare meter digits, keyAccidNatural (key changes), mRest, mordent, fermata,
# staccatissimo, dynamics mp/pp/ff/mf, flags and 32nd/16th rests, tuplets.
# data/synthetic-lite (musicset synth, varied engraving, seed 2): 1.5k
# exercises + 1.5k short rare-meter exercises + 1.5k piano pieces (profile
# 'rare': detector weighting with normal fingering rates; key changes and
# whole-measure rests), 750 mutations + 750 arrangements of train-lite.
# NOT expected to move: staff / system-staff (coincident-box confusion on
# single-staff pages).

# Data args
img_dir: "data/train-lite/imgs"
ann_dir: "data/train-lite/annotations"
synthetic_img_dir: "data/synthetic-lite/imgs"
synthetic_ann_dir: "data/synthetic-lite/annotations"
use_synthetic: true
synthetic_ratio: 3
config: "conf-lite/config.json"
input_size: 640
num_workers: 4

# Model args
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 7.5
cls_weight: 1.0
max_gamma: 4.5    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null

# Training args
output_dir: "checkpoints_lite"
logging_dir: "runs_lite"
# 1 real : 3 synthetic, so an epoch is 10.4k steps: 10 epochs ~ the base run
epochs: 10
batch_size: 4
# 3k-step sweep from run_004 (mAP@.50 / weak-class mean AP@.50:.95, base
# 0.656 / 0.106): 2e-4 0.653 / 0.140, 5e-4 0.639 / 0.143, 1e-3 0.635 / 0.136,
# 2e-3 0.633 / 0.158; the other classes lose -0.017 / -0.029 / -0.037 (2e-4,
# 1e-3, 2e-3): weak gains flat, cost growing with lr
lr: 0.0002
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: "checkpoints_lite/run_004/"
