# LITE synthetic fine-tune — stage 3c/3d of the loop on the lite track.
# Targets the measured rare-class gaps of checkpoints_lite/run_001
# (validation-lite, base run mAP@.50 0.560): dynamics p/f/mp/mf (233-452
# train instances, AP 0.01-0.19), rest16th/restHalf/mRest (AP 0.00-0.05),
# mordent/fermata, timeSig digits, accidentalFlat/Natural.
# data/synthetic-lite = 1.5k writer exercises (weighted rare meters/
# dynamics/ornaments, piano grand staff) + 1.5k generator mutations of the
# lite corpus itself (structure stays single-staff/piano, one voice).
# NOT expected to move: beam16/beamBroken/meterSig/stem32 (thin-shape
# group) and system-staff (coincident-box confusion on single-staff
# scores — separate investigation).

# Data args
img_dir: "data/train-lite/imgs"
ann_dir: "data/train-lite/annotations"
synthetic_img_dir: "data/synthetic-lite/imgs"
synthetic_ann_dir: "data/synthetic-lite/annotations"
use_synthetic: true
synthetic_ratio: 3
config: "conf-lite/config.json"
input_size: 640
num_workers: 4

# Model args
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 7.5
cls_weight: 1.0
max_gamma: 4.5    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null

# Training args
output_dir: "checkpoints_lite"
logging_dir: "runs_lite"
epochs: 20
batch_size: 4
lr: 0.00025
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: "checkpoints_lite/run_001/"
