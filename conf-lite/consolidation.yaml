# LITE consolidation — stage 3d: mostly real data (9:1) at low lr to lock
# in the fine-tune gains (run_002: dynamics 0.05->0.9+, accidentals ->0.96+,
# timeSig1 ->0.80) while recovering the synthetic-heavy see-saw regressions
# (system 0.78->0.56, measure 0.59->0.56, chord 0.42->0.38 — the same
# pattern the full model showed between its run_002 and run_003).

# Data args
img_dir: "data/train-lite/imgs"
ann_dir: "data/train-lite/annotations"
synthetic_img_dir: "data/synthetic-lite/imgs"
synthetic_ann_dir: "data/synthetic-lite/annotations"
use_synthetic: true
synthetic_ratio: -9
config: "conf-lite/config.json"
input_size: 640
num_workers: 4

# Model args
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 5.0
cls_weight: 1.0
max_gamma: 3.0    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null

# Training args
output_dir: "checkpoints_lite"
logging_dir: "runs_lite"
epochs: 30
batch_size: 4
lr: 0.00005
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: "checkpoints_lite/run_002/"
