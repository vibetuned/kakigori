# LITE consolidation on the ReGLA fine-tune (checkpoints_lite/run_005:
# mAP@.50 0.656 / .50:.95 0.506, weak-class mean 0.106 -> 0.246): mostly real
# data (9:1) to keep those gains while recovering the synthetic-heavy
# regressions (fermata 0.51 -> 0.10, read as mordent/turn/trill: synthetic
# pages carry far more ornaments than real ones; clefC, dynamicMF, rest16th).

# Data args
img_dir: "data/train-lite/imgs"
ann_dir: "data/train-lite/annotations"
synthetic_img_dir: "data/synthetic-lite/imgs"
synthetic_ann_dir: "data/synthetic-lite/annotations"
use_synthetic: true
synthetic_ratio: -9
config: "conf-lite/config.json"
input_size: 640
num_workers: 4

# Model args
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 5.0
cls_weight: 1.0
max_gamma: 3.0    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null

# Training args
output_dir: "checkpoints_lite"
logging_dir: "runs_lite"
epochs: 30
batch_size: 4
# 3k-step sweep from run_005 (mAP@.50 / .50:.95 / weak-class mean, fine-tune
# 0.656 / 0.506 / 0.246): 5e-5 0.650 / 0.500 / 0.231, 1e-4 0.658 / 0.509 /
# 0.255, 2e-4 0.671 / 0.521 / 0.287, 4e-4 0.667 / 0.518 / 0.304
lr: 0.0002
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: "checkpoints_lite/run_005/"
