# LITE detector, ConvNeXt-B DINOv3 baseline on the same data as the ReGLA
# base run (conf-lite/train.yaml -> checkpoints_lite/run_004): the clean
# backbone comparison. Pretrained, fed grey pages repeated to RGB.

# Data args
img_dir: "data/train-lite/imgs"
ann_dir: "data/train-lite/annotations"
synthetic_img_dir: "data/synthetic-boost/imgs"
synthetic_ann_dir: "data/synthetic-boost/annotations"
use_synthetic: false
synthetic_ratio: 4
config: "conf-lite/config.json"
input_size: 640
num_workers: 4

# Model args
backbone: convnext_base.dinov3_lvd1689m
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 5.0
cls_weight: 1.0
max_gamma: 4.0    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null  # scale/resolution changes ruled out by docs/experiments/vision

# Training args
output_dir: "checkpoints_lite"
logging_dir: "runs_lite"
epochs: 40
batch_size: 4
lr: 0.0001  # 2k-step check, best of 1e-4 / 3e-4
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: null
