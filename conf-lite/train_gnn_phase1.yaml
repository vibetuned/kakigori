# LITE GNN — PHASE 1: GATv2 edge classifier from scratch on the lite corpus,
# frozen lite detector, ground-truth boxes (docs/graph.md curriculum).
# 99 classes (conf-lite), 9,699 pages / 9,500 graphs. Note: lite has no
# syl/verse, so edge class 4 (sync-text) never occurs — f1_sync_text will
# read 0 by construction; judge on the other classes.
# Reference: the full model's phase 1 reached f1_macro 0.825.

img_dir: "data/train-lite/imgs"
ann_dir: "data/train-lite/annotations"
graph_dir: "data/train-lite/graphs"
config: "conf-lite/config.json"

# Paths follow pipeline-gnn.sh (which sets them anyway): the 640x896 ReGLA
# detector, every GNN stage in checkpoints_gnn_lite_896 (phase 1 run_001,
# phase 2 run_002, joint run_003). The July ConvNeXt runs were
# checkpoints_lite/run_003 -> checkpoints_gnn_lite -> checkpoints_joint.
detector_checkpoint: "checkpoints_lite_896/run_003"

unfreeze: "none"
vision_lr: 0.00001
box_jitter: 0.0

output_dir: "checkpoints_gnn_lite_896"
logging_dir: "runs_gnn_lite_896"
epochs: 30
batch_size: 2
lr: 0.001
logging_steps: 10
eval_steps: 2500
save_steps: 250
max_steps: -1
seed: 42
