# lite2 (scripts/build-lite2.sh): the same recipe as consolidation.yaml on the clean,
# balanced sets — train-lite2 (real) and synthetic-lite2; output dirs and
# checkpoints are set by pipeline-lite.sh / pipeline-gnn.sh.

# Data args
img_dir: "data/train-lite2/imgs"
ann_dir: "data/train-lite2/annotations"
synthetic_img_dir: "data/synthetic-lite2/imgs"
synthetic_ann_dir: "data/synthetic-lite2/annotations"
use_synthetic: true
synthetic_ratio: -9
config: "conf-lite/config.json"
input_size: null  # the checkpoint's canvas (set one to move it)
num_workers: 4

# Model args
# levels, neck and canvas come from the fine_tune checkpoint
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 5.0
cls_weight: 1.0
max_gamma: 3.0    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null  # the checkpoint's own

# Training args
output_dir: "checkpoints_lite"
logging_dir: "runs_lite"
epochs: 30
batch_size: 4
# 3k-step sweep from run_005 (mAP@.50 / .50:.95 / weak-class mean, fine-tune
# 0.656 / 0.506 / 0.246): 5e-5 0.650 / 0.500 / 0.231, 1e-4 0.658 / 0.509 /
# 0.255, 2e-4 0.671 / 0.521 / 0.287, 4e-4 0.667 / 0.518 / 0.304
lr: 0.0002
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: "checkpoints_lite/run_005/"
