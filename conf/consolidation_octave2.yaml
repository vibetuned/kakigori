# Second octave-clef recovery round. Round 1 (conf/consolidation_octave.yaml,
# run_005) lifted clefG8va 0.019 -> 0.117 with ~2k instances; dose-response vs
# clefG8vb (0.98 at ~5.8k instances) says the gap is data volume, so this round
# adds data/synthetic-octave2: 1500 scores generated with
#   synthetic-generator --octave-rate 0.6 --octave-8va-weight 0.9
# merged into data/synthetic-combined (oct2_ prefix). Fine-tunes from run_005.

# Data args
img_dir: "data/train-small/imgs"
ann_dir: "data/train-small/annotations"
synthetic_img_dir: "data/synthetic-combined/imgs"
synthetic_ann_dir: "data/synthetic-combined/annotations"
use_synthetic: true
synthetic_ratio: -9
config: "conf/config.json"
input_size: 640
num_workers: 4

# Model args
use_bottom_up: false
out_indices: [0, 1, 2]

# Trainer args
reg_weight: 5.0
cls_weight: 1.0
max_gamma: 3.0    # Final gamma for focal loss
base_gamma: 2.0   # Initial gamma for focal loss
scale_ranges: null

# Training args
output_dir: "checkpoints"
logging_dir: "runs"
epochs: 20
batch_size: 4
lr: 0.00005
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
fine_tune: "checkpoints/run_005/"
